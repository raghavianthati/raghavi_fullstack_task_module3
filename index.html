<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="card shadow">

        <div class="card-header text-center bg-primary text-white">
            <h2>Student Registration Form</h2>
            <p class="mb-0">Enter your details below</p>
        </div>

        <div class="card-body">

            <form id="studentForm">

                <!-- Student Name -->
                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text"
                           id="studentName"
                           class="form-control"
                           placeholder="Enter your name">
                    <small id="nameError" class="text-danger"></small>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="Enter your email">
                    <small id="emailError" class="text-danger"></small>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text"
                           id="phone"
                           class="form-control"
                           placeholder="Enter 10 digit phone number">
                    <small id="phoneError" class="text-danger"></small>
                </div>

                <!-- Date of Birth -->
                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date"
                           id="dob"
                           class="form-control">
                </div>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <div>
                        <input type="radio" name="gender" value="Male">
                        Male

                        <input type="radio" name="gender" value="Female" class="ms-3">
                        Female

                        <input type="radio" name="gender" value="Other" class="ms-3">
                        Other
                    </div>
                </div>

                <!-- Course -->
                <div class="mb-3">
                    <label class="form-label">Course</label>

                    <select id="course" class="form-select">
                        <option value="">Select Course</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                        <option value="M.Tech">M.Tech</option>
                    </select>
                </div>

                <!-- Department -->
                <div class="mb-3">
                    <label class="form-label">Department</label>

                    <select id="department" class="form-select">
                        <option value="">Select Department</option>
                        <option value="AI & DS">Artificial Intelligence & Data Science</option>
                        <option value="CSE">Computer Science Engineering</option>
                        <option value="ECE">Electronics & Communication Engineering</option>
                        <option value="EEE">Electrical & Electronics Engineering</option>
                        <option value="MECH">Mechanical Engineering</option>
                    </select>
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label class="form-label">Address</label>

                    <textarea id="address"
                              class="form-control"
                              rows="3"
                              placeholder="Enter your address"></textarea>
                </div>

                <!-- Skills -->
                <div class="mb-3">
                    <label class="form-label">Skills</label>

                    <div>
                        <input type="checkbox" name="skills" value="HTML">
                        HTML

                        <input type="checkbox" name="skills" value="CSS" class="ms-3">
                        CSS

                        <input type="checkbox" name="skills" value="JavaScript" class="ms-3">
                        JavaScript

                        <input type="checkbox" name="skills" value="Java" class="ms-3">
                        Java

                        <input type="checkbox" name="skills" value="Python" class="ms-3">
                        Python
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="Enter password">
                </div>

                <!-- Buttons -->
                <div class="text-center">

                    <button type="submit"
                            class="btn btn-primary">
                        Register
                    </button>

                    <button type="reset"
                            class="btn btn-secondary ms-2"
                            id="resetBtn">
                        Reset
                    </button>

                </div>

            </form>

            <!-- Success Message -->
            <div id="successMessage"
                 class="alert alert-success mt-4 text-center"
                 style="display:none;">

                Student Registration Successful!

            </div>

        </div>
    </div>
</div>


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->
<script src="script.js"></script>

</body>
</html>
